[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groovemap-runtime"
version = "0.1.0"
description = "Runtime resilience, health, normalization, and observability primitives for GrooveMap services"
authors = [{name = "Robert Wlodarczyk", email = "robert@simplicityguy.com"}]
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
license = {text = "MIT"}
dependencies = [
    "orjson>=3.12.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
metrics = ["prometheus-client>=0.26.0"]
neo4j = ["neo4j-rust-ext>=6.2.0.0"]
postgres = ["psycopg[binary]>=3.3.4"]
rabbitmq = ["aio-pika>=10.0.1", "pika>=1.4.4"]
all = ["aio-pika>=10.0.1", "neo4j-rust-ext>=6.2.0.0", "pika>=1.4.4", "prometheus-client>=0.26.0", "psycopg[binary]>=3.3.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
