[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groovemap-agent-tools"
version = "0.1.0"
description = "Framework-neutral agent query tools for GrooveMap"
authors = [{name = "Robert Wlodarczyk", email = "robert@simplicityguy.com"}]
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = ["groovemap-runtime==0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
