---
# Dependency cooldowns are deliberately NOT set here, and the semgrep rule asking
# for them is suppressed per-ecosystem below.
#
# Rationale: a cooldown delays every update, including security fixes. Combined with
# uv's own `exclude-newer` quarantine in pyproject.toml, a 7-day cooldown meant
# CVE-2026-69247's published fix was unreachable while pip-audit and osv-scanner —
# both reachability-blind — failed every PR over it. The pipeline was blocked by the
# very control meant to protect it. We take updates promptly and rely on review,
# pinned CI tooling, and the scanners themselves rather than on a waiting period.
#
# Revisit if the repo ever ingests a compromised release that a cooldown would have
# caught; that is the trade being made.
version: 2
updates:
  # GitHub Actions dependencies
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/docker-build-cache"
      - "/.github/actions/setup-python-uv"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    assignees:
      - "SimplicityGuy"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-version:
        applies-to: version-updates
        patterns:
          - "*"

  # Docker base images for all services
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "docker"
    directories:
      - "/api"
      - "/brainzgraphinator"
      - "/brainztableinator"
      - "/dashboard"
      - "/explore"
      - "/extractor"
      - "/graphinator"
      - "/insights"
      - "/schema-init"
      - "/tableinator"
      - "/tests/perftest"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "SimplicityGuy"
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker-version:
        applies-to: version-updates
        patterns:
          - "*"

  # Rust dependencies for the extractor
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "cargo"
    directory: "/"  # workspace root; covers the extractor member
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    assignees:
      - "SimplicityGuy"
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
      cargo-version:
        applies-to: version-updates
        patterns:
          - "*"

  # Node.js dependencies for Explore frontend tests
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "npm"
    directories:
      - "/explore"
      - "/migration/destinations/groovemap-music.github.io"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    assignees:
      - "SimplicityGuy"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-version:
        applies-to: version-updates
        patterns:
          - "*"

  # Python dependencies for all services
  # Using pip ecosystem as uv is not directly supported yet
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "pip"
    directories:
      - "/"  # Root project
      - "/api"
      - "/brainzgraphinator"
      - "/brainztableinator"
      - "/common"
      - "/common/agent-tools"
      - "/dashboard"
      - "/explore"
      - "/graphinator"
      - "/insights"
      - "/mcp-server"
      - "/schema-init"
      - "/tableinator"
      - "/utilities"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "SimplicityGuy"
    open-pull-requests-limit: 10
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
      pip-version:
        applies-to: version-updates
        patterns:
          - "*"

  # Docker Compose service images
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
    assignees:
      - "SimplicityGuy"
    groups:
      docker-compose-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker-compose-version:
        applies-to: version-updates
        patterns:
          - "*"

  # pre-commit hook revisions
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    assignees:
      - "SimplicityGuy"
    groups:
      pre-commit-security:
        applies-to: security-updates
        patterns:
          - "*"
      pre-commit-version:
        applies-to: version-updates
        patterns:
          - "*"
