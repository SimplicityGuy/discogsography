---
# Dependency cooldowns are deliberately NOT set here, and the semgrep rule asking
# for them is suppressed per-ecosystem below.
#
# Rationale: a cooldown delays every update, including security fixes. Combined with
# uv's own `exclude-newer` quarantine in pyproject.toml, a 7-day cooldown meant
# CVE-2026-69247's published fix was unreachable while pip-audit and osv-scanner —
# both reachability-blind — failed every PR over it. The pipeline was blocked by the
# very control meant to protect it. We take updates promptly and rely on review,
# pinned CI tooling, and the scanners themselves rather than on a waiting period.
#
# Revisit if the repo ever ingests a compromised release that a cooldown would have
# caught; that is the trade being made.
version: 2
updates:
  # GitHub Actions dependencies
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    assignees:
      - "SimplicityGuy"
    groups:
      actions:
        patterns:
          - "*"

  # Docker base images for all services
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "docker"
    directories:
      - "/api"
      - "/dashboard"
      - "/explore"
      - "/extractor"
      - "/graphinator"
      - "/insights"
      - "/schema-init"
      - "/tableinator"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "SimplicityGuy"
    groups:
      docker-images:
        patterns:
          - "*"

  # Rust dependencies for the extractor
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    assignees:
      - "SimplicityGuy"

  # Node.js dependencies for Explore frontend tests
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "npm"
    directory: "/explore"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    assignees:
      - "SimplicityGuy"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Python dependencies for all services
  # Using pip ecosystem as uv is not directly supported yet
  # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
  - package-ecosystem: "pip"
    directories:
      - "/"  # Root project
      - "/api"
      - "/common"
      - "/dashboard"
      - "/explore"
      - "/graphinator"
      - "/insights"
      - "/schema-init"
      - "/tableinator"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    assignees:
      - "SimplicityGuy"
    open-pull-requests-limit: 10
    groups:
      # Production Python dependencies
      python-production:
        dependency-type: "production"
        patterns:
          - "*"
      # Development Python dependencies
      python-development:
        dependency-type: "development"
        patterns:
          - "*"
      # Security updates get their own group for immediate attention
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
