---
# This is the primary test workflow that runs all unit and integration tests.
# It is called by the build.yml workflow.
# For E2E and browser testing, see e2e-test.yml.
#
# All service test jobs run in PARALLEL to minimize total workflow time.
# Each service has its own isolated test job that can run independently.
name: Test

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token"
        required: false

env:
  CI: true
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

permissions:
  contents: read
  pull-requests: write  # Required for coverage report comments

jobs:
  # ============================================================================
  # API SERVICE TESTS - Runs in parallel with all other test jobs
  # ============================================================================
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🔧 Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: just install

      - name: 🧪 Run api tests
        run: just test-api

      - name: 📊 Upload coverage (api)
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: SimplicityGuy/discogsography
          files: ./coverage.xml
          flags: api
          name: api-tests
          fail_ci_if_error: false
          disable_search: true
          verbose: false

  # ============================================================================
  # COMMON/SHARED LIBRARY TESTS - Runs in parallel with all other test jobs
  # ============================================================================
  test-common:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🔧 Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: just install

      - name: 🧪 Run common tests
        run: just test-common

      - name: 📊 Upload coverage (common)
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: SimplicityGuy/discogsography
          files: ./coverage.xml
          flags: common
          name: common-tests
          fail_ci_if_error: false
          disable_search: true
          verbose: false

  # ============================================================================
  # DASHBOARD SERVICE TESTS - Runs in parallel with all other test jobs
  # ============================================================================
  test-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🔧 Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: just install

      - name: 🎭 Install Playwright browsers
        run: |
          uv run playwright install chromium
          uv run playwright install-deps chromium

      - name: 🧪 Run dashboard tests
        run: just test-dashboard

      - name: 📊 Upload coverage (dashboard)
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: SimplicityGuy/discogsography
          files: ./coverage.xml
          flags: dashboard
          name: dashboard-tests
          fail_ci_if_error: false
          disable_search: true
          verbose: false

  # ============================================================================
  # EXPLORE SERVICE TESTS - Runs in parallel with all other test jobs
