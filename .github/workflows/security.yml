---
# This workflow runs security scans including dependency vulnerability scanning,
# secret detection, and container vulnerability scanning.
# It is called by the build.yml workflow.
# Workflow linting (actionlint) is handled by pre-commit (see .pre-commit-config.yaml).
# Dockerfile linting (hadolint) is handled by docker-validate.yml.
# Covers issue #72: https://github.com/SimplicityGuy/discogsography/issues/72
name: Security

on:
  workflow_call:

env:
  CI: true
  PYTHON_VERSION: "3.13"

permissions:
  contents: read
  security-events: write # Required for SARIF uploads to GitHub Security tab

jobs:
  python-security:
    name: Python Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🔧 Setup Python and UV
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install dependencies
        run: just install-all

      - name: 🔍 Run pip-audit (Python dependency vulnerability scan)
        run: just pip-audit

      - name: 🛡️ Run bandit (Python SAST)
        run: just security

      - name: 🌐 Run osv-scanner (multi-ecosystem vulnerability scan)
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1  # v2.5.0

  semgrep:
    name: Semgrep CE Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      # Pinned by digest. `semgrep/semgrep` with no tag is `:latest`, so the scanner
      # engine silently changed under us on any day upstream published. This digest is
      # what `latest` resolved to when pinned (v1.171.0), so the pin is behaviour-neutral.
      # Bump deliberately; `--config auto` still fetches rules at scan time, which is the
      # other drift vector — handled by the ERROR-severity gate at the end of this job.
      image: semgrep/semgrep:1.171.0@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8

    if: github.actor != 'dependabot[bot]'

    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🔬 Run semgrep scan
        # Deliberately no `--error`. With it, ANY finding at ANY severity failed the
        # build, so a rule published upstream turned every PR red without a commit
        # here — that is how the dependabot/uv cooldown rules broke CI. Severity
        # gating now happens after the SARIF is uploaded, so warnings and notes still
        # reach GitHub Advanced Security as alerts instead of blocking the pipeline.
        run: semgrep scan --config auto --sarif --output semgrep.sarif

      - name: 🧹 Remove nosemgrep-suppressed findings from SARIF
        # Semgrep includes `# nosemgrep` suppressed findings in SARIF with a
        # `suppressions` field. GitHub Code Scanning still creates alerts from
        # them, even though they are intentionally silenced. Strip them before
        # upload so GHAS only sees genuinely un-suppressed findings.
        run: |
          python3 - <<'EOF'
          import json
          with open("semgrep.sarif") as f:
              sarif = json.load(f)
          for run in sarif.get("runs", []):
              run["results"] = [
                  r for r in run.get("results", [])
                  if not r.get("suppressions")
              ]
          with open("semgrep.sarif", "w") as f:
              json.dump(sarif, f)
          EOF
        if: always()

      - name: 📤 Upload SARIF to GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          sarif_file: semgrep.sarif
        if: always()

      - name: 🚦 Fail on ERROR-severity findings
        # Runs last, and after the upload, so every finding reaches GHAS regardless of
        # the verdict here. Only SARIF level `error` blocks; `warning` and `note` are
        # reported, not enforced. This is the same policy hadolint uses
        # (--failure-threshold error) — a new low-severity rule should tell us
        # something, not stop the line.
        run: |
          python3 - <<'EOF'
          import json
          import sys

          with open("semgrep.sarif") as f:
              sarif = json.load(f)

          blocking = []
          for run in sarif.get("runs", []):
              # Semgrep omits `level` on individual results, so reading result["level"]
              # matches nothing and the gate silently passes everything. Severity lives on
              # the rule: runs[].tool.driver.rules[].defaultConfiguration.level, joined to
              # results by ruleId. Verified against a real scan — 26 of 35 findings are
              # error-severity via this path, 0 via result["level"].
              severity = {
                  rule.get("id"): rule.get("defaultConfiguration", {}).get("level")
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", [])
              }
              for result in run.get("results", []):
                  if severity.get(result.get("ruleId")) == "error":
                      blocking.append(result)

          if not blocking:
              print("✅ No ERROR-severity semgrep findings")
              sys.exit(0)

          print(f"❌ {len(blocking)} ERROR-severity semgrep finding(s):")
          for result in blocking:
              loc = result.get("locations", [{}])[0].get("physicalLocation", {})
              path = loc.get("artifactLocation", {}).get("uri", "?")
              line = loc.get("region", {}).get("startLine", "?")
              print(f"  {result.get('ruleId', '?')} — {path}:{line}")
          sys.exit(1)
          EOF
        if: always()

  rust-security:
    name: Rust Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      - name: 💾 Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            extractor/target/
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-security-
            ${{ runner.os }}-cargo-

      - name: 📦 Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1  # v2.85.13
        with:
          tool: cargo-audit,cargo-deny

      - name: 🔧 Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Run cargo-audit (Rust advisory database scan)
        run: just extractor-audit

      - name: 🛡️ Run cargo-deny (Rust license and policy check)
        run: just extractor-deny

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # Full history required for comprehensive secret scanning

      - name: 🔑 Run TruffleHog (secret detection)
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318  # v3.97.0
        with:
          path: ./
          extra_args: --only-verified

  container-scanning:
    name: Container Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🛡️ Run trivy (filesystem vulnerability scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: 📤 Upload trivy SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        if: always()
        with:
          sarif_file: trivy-results.sarif
