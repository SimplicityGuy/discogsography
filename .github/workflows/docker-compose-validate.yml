---
# This workflow validates docker-compose configuration including syntax,
# service definitions, dependencies, and security best practices.
# It is called by the build.yml workflow.
name: Docker Compose Validate

on:
  workflow_call:

env:
  CI: true
  COMPOSE_VERSION: "v2.32.0"

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔀 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: 🔧 Install docker-compose
        uses: alexellis/arkade-get@1eef818e467c387d3f50cfe0d2c565d1cbe82b03  # master
        with:
          docker-compose: ${{ env.COMPOSE_VERSION }}

      - name: 📋 Validate docker-compose syntax
        env:
          # The prod overlay declares APP_BASE_URL with `:?`, so an unset value is a
          # hard error — that is deliberate, to stop a production stack booting with
          # a localhost default and mailing every user a link to their own machine.
          # `config` evaluates interpolation, so this job has to supply a value. The
          # value is irrelevant; only that it is set. Do not "fix" this by weakening
          # the `:?` in docker-compose.prod.yml to a default.
          APP_BASE_URL: "https://ci.invalid"
        run: |
          docker-compose config --quiet
          echo "✅ docker-compose.yml is valid"

          if [ -f docker-compose.prod.yml ]; then
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
            echo "✅ docker-compose.prod.yml overlay is valid"
          fi

      - name: 🔍 Check docker-compose services
        run: |
          services=$(docker-compose config --services | sort | tr "\n" " " | sed "s/ $//")
          expected="api brainzgraphinator brainztableinator dashboard explore"
          expected="$expected extractor-discogs extractor-musicbrainz graphinator"
          expected="$expected insights neo4j postgres rabbitmq redis schema-init tableinator"

          if [ "$services" != "$expected" ]; then
            echo "❌ Service mismatch!"
            echo "Expected: $expected"
            echo "Got: $services"
            exit 1
          fi
          echo "✅ All expected services are defined"

      - name: 🔒 Validate service dependencies
        run: |
          # Check that services have correct dependencies. Each assertion checks BOTH
          # the set of dependency names AND the condition: each is gated on — a
          # keys-only check would stay green if a PR silently downgraded
          # service_completed_successfully (schema-init must finish before consumers
          # start) or service_healthy (DBs/broker must be ready) to service_started,
          # defeating the startup-ordering guarantee those conditions exist to enforce
          # (discogsography-pjd5).
          check_deps() {
            local service="$1" expected_keys="$2" expected_conditions="$3" description="$4"
            local config; config=$(docker-compose config)

            local keys; keys=$(echo "$config" | yq eval ".services.$service.depends_on | keys | sort | join(\" \")" -)
            if [ "$keys" != "$expected_keys" ]; then
              echo "❌ $description (dependency set): expected [$expected_keys], got [$keys]"
              exit 1
            fi

            local conditions
            conditions=$(echo "$config" | yq eval ".services.$service.depends_on | to_entries | sort_by(.key) | map(.key + \"=\" + .value.condition) | join(\" \")" -)
            if [ "$conditions" != "$expected_conditions" ]; then
              echo "❌ $description (condition): expected [$expected_conditions], got [$conditions]"
              exit 1
            fi
          }

          check_deps dashboard \
            "api neo4j postgres rabbitmq redis schema-init" \
            "api=service_healthy neo4j=service_healthy postgres=service_healthy rabbitmq=service_healthy redis=service_healthy schema-init=service_completed_successfully" \
            "Dashboard should depend on api, neo4j, postgres, rabbitmq, redis, and schema-init"

          check_deps extractor-discogs \
            "rabbitmq" \
            "rabbitmq=service_healthy" \
            "Extractor-discogs should only depend on rabbitmq"

          check_deps extractor-musicbrainz \
            "rabbitmq" \
            "rabbitmq=service_healthy" \
            "Extractor-musicbrainz should only depend on rabbitmq"

          check_deps brainzgraphinator \
            "neo4j rabbitmq schema-init" \
            "neo4j=service_healthy rabbitmq=service_healthy schema-init=service_completed_successfully" \
            "Brainzgraphinator should depend on neo4j, rabbitmq, and schema-init"

          check_deps graphinator \
            "neo4j rabbitmq schema-init" \
            "neo4j=service_healthy rabbitmq=service_healthy schema-init=service_completed_successfully" \
            "Graphinator should depend on neo4j, rabbitmq, and schema-init"

          check_deps explore \
            "api schema-init" \
            "api=service_healthy schema-init=service_completed_successfully" \
            "Explore should depend on api and schema-init"

          check_deps tableinator \
            "postgres rabbitmq schema-init" \
            "postgres=service_healthy rabbitmq=service_healthy schema-init=service_completed_successfully" \
            "Tableinator should depend on postgres, rabbitmq, and schema-init"

          check_deps brainztableinator \
            "postgres rabbitmq schema-init" \
            "postgres=service_healthy rabbitmq=service_healthy schema-init=service_completed_successfully" \
            "Brainztableinator should depend on postgres, rabbitmq, and schema-init"

          check_deps schema-init \
            "neo4j postgres" \
            "neo4j=service_healthy postgres=service_healthy" \
            "Schema-init should depend on neo4j and postgres"

          check_deps insights \
            "api postgres redis schema-init" \
            "api=service_healthy postgres=service_healthy redis=service_healthy schema-init=service_completed_successfully" \
            "Insights should depend on api, postgres, redis, and schema-init"

          check_deps api \
            "neo4j postgres redis schema-init" \
            "neo4j=service_healthy postgres=service_healthy redis=service_healthy schema-init=service_completed_successfully" \
            "API should depend on neo4j, postgres, redis, and schema-init"

          echo "✅ Service dependencies (and their startup-ordering conditions) are correct"

      - name: 🛡️ Check for security best practices
        run: |
          # Check that services run as non-root user
          for service in api brainzgraphinator brainztableinator dashboard explore \
            extractor-discogs extractor-musicbrainz graphinator insights schema-init tableinator; do
            user=$(docker-compose config | yq eval ".services.$service.user" -)
            if [ -z "$user" ] || [ "$user" = "null" ]; then
              echo "❌ $service should have a user configured"
              exit 1
            fi
          done
          echo "✅ All services run as non-root user"

          # Check security options
          for service in api brainzgraphinator brainztableinator dashboard explore \
            extractor-discogs extractor-musicbrainz graphinator insights schema-init tableinator; do
            security_opt=$(docker-compose config | yq eval ".services.$service.security_opt[]" - | grep "no-new-privileges:true" || true)
            if [ -z "$security_opt" ]; then
              echo "❌ $service should have no-new-privileges security option"
              exit 1
            fi
          done
          echo "✅ Security options are properly set"
