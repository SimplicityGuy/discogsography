[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groovemap-operations-toolkit"
version = "0.1.0"
description = "Queue, error, system, and deployment inspection tools for GrooveMap"
requires-python = ">=3.13"
license = {text = "PolyForm-Noncommercial-1.0.0"}
dependencies = [
    "groovemap-runtime[rabbitmq]==0.1.0",
    "psutil>=7.2.2",
    "requests>=2.34.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
